name: tests
# The repo had no pytest job (only the gitleaks gate). This runs the offline suite: tests/conftest.py
# leaves the Postgres-backed scripts (test_backfill_logic/cli, test_nse_tier) to ./run_tests.sh.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pandas sqlalchemy
      - name: Run offline tests with coverage
        run: python -m pytest tests -q -p no:cacheprovider --cov --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
