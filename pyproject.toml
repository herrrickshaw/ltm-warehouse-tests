[project]
name = "ltm-warehouse-tests"
version = "0.1.0"
description = "Test harness for the LTM warehouse maintenance scripts"
requires-python = ">=3.9"
dependencies = ["sqlalchemy>=1.4", "psycopg2-binary>=2.9", "pandas>=1.3", "yfinance", "requests", "jugaad-data"]

[tool.pytest.ini_options]
# tests/test_*.py are legacy run_tests.sh scripts (they execute at import); pytest only collects tests/unit.
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402", "E501", "E741"]  # legacy run_tests.sh scripts, left unchanged
"scripts/exchange_map.py" = ["E501"]
